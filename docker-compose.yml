# Laboratorio de monitoreo: la tienda Órdenes → Pagos (Postgres, pool chico) → Envíos, instrumentada
# con OpenTelemetry; métricas en Prometheus, trazas en Tempo, logs en Loki, todo en Grafana; alertas
# en Alertmanager; y Docker (restart + healthcheck) como supervisor.
# Instrucciones en el README ("Laboratorio con Docker").
name: lab-monitoreo

x-servicio: &servicio
  build: ./lab/servicio
  image: lab-monitoreo-servicio
  restart: on-failure            # el supervisor: si el proceso termina con error, Docker lo vuelve a levantar
  volumes: ["estado:/estado"]    # las fallas de /romper se guardan acá (las ven todas las réplicas)
  depends_on: [collector]

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

services:
  # ---------- La tienda ----------
  ordenes:
    <<: *servicio
    environment:
      <<: *otel
      SERVICIO: ordenes
      OTEL_SERVICE_NAME: ordenes
      SIGUIENTE: http://pagos:3000
      TIMEOUT_MS: "2000"          # cuánto espera Órdenes a Pagos
    ports: ["8080:3000"]

  pagos:
    <<: *servicio
    environment:
      <<: *otel
      SERVICIO: pagos
      OTEL_SERVICE_NAME: pagos
      SIGUIENTE: http://envios:3000
      POOL: "4"                   # conexiones a Postgres por réplica
      POOL_ESPERA_MS: "1000"      # cuánto espera un pedido por una conexión libre del pool
      LENTO_S: "0.13"             # modo lento: cada cobro tarda esto en la caja (de a uno: ~7,7 por segundo)
      LENTO_RAMPA_S: "60"         # …y llega de a poco, en 60 s (primero sube la latencia, después los errores)
      PGHOST: db
      PGUSER: tienda
      PGPASSWORD: tienda
      PGDATABASE: tienda
    depends_on:
      collector: { condition: service_started }
      db: { condition: service_healthy }
    healthcheck:                  # la "liveness": ¿contesta /salud en menos de 1 s?
      test: ["CMD", "wget", "-q", "-T", "1", "-O", "/dev/null", "http://localhost:3000/salud"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 5s

  envios:
    <<: *servicio
    environment:
      <<: *otel
      SERVICIO: envios
      OTEL_SERVICE_NAME: envios

  db:
    image: postgres:18.7-alpine
    # 20 conexiones en total, 3 reservadas para el superusuario: a Pagos (usuario tienda) le quedan 17
    # (alcanzan para 3 réplicas × POOL 4; con 5 réplicas ya no).
    command: ["postgres", "-c", "max_connections=20"]
    environment: { POSTGRES_PASSWORD: tienda, POSTGRES_DB: tienda }
    volumes: ["./lab/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # ---------- Telemetría ----------
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes: ["./lab/otel/collector.yaml:/etc/otelcol/collector.yaml:ro"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./lab/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./lab/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./lab/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./lab/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10    # con su configuración por defecto (acepta OTLP en /otlp)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # sin login: es un laboratorio local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tienda.json
    volumes:
      - ./lab/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./lab/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped

  # ---------- Carga (sólo cuando se pide) ----------
  carga:
    image: grafana/k6:1.8.2
    profiles: [carga]
    command: ["run", "/carga/checkout.js"]
    volumes: ["./lab/carga:/carga:ro"]
    depends_on: [ordenes]

volumes:
  estado:
  tempo:
