# Prometheus va a buscar las métricas cada 5 s y evalúa las reglas de alerta cada 5 s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Las métricas de los tres servicios, a través del collector. honor_labels respeta el
  # label job que pone el collector (= service.name: ordenes, pagos, envios).
  - job_name: collector
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]
