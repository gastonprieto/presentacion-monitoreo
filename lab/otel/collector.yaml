# OpenTelemetry Collector: recibe las tres señales por OTLP y las reparte.
#   métricas → las expone en :8889 y Prometheus las va a buscar (scrape)
#   trazas   → Tempo (OTLP gRPC)
#   logs     → Loki (OTLP HTTP, endpoint /otlp)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 30s   # la serie de un contenedor que ya no existe desaparece rápido
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
